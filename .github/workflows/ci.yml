name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,inference,intelligence]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # The 9 tests that need an exported ONNX model or a dataset skip
      # automatically. The coverage gate is dropped here because those skipped
      # tests exercise a few branches; run `pytest` locally with the assets for
      # the full 95% figure.
      - name: Tests
        run: pytest -q --cov-fail-under=0
