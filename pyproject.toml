[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptivevision"
version = "0.0.0"
description = "Industrial 2D/3D Vision, AOI & Metrology Edge Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AdaptiveVision Team" }]
keywords = ["computer-vision", "aoi", "metrology", "edge-ai", "industrial"]
# Runtime dependencies are added by the milestone that first needs them.
# Milestone M4 introduces SQLAlchemy for the local edge persistence layer.
# Milestone M13 introduces FastAPI for the minimal HTTP API.
# Milestone M18 introduces uvicorn for the containerized edge API server.
# Milestone M19 introduces pydantic to validate untrusted LLM advisory output
# before it is converted to the domain's own frozen-dataclass value objects.
dependencies = [
    "numpy>=1.26,<2",
    "sqlalchemy>=2.0,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.9,<3",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.6",

    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "httpx>=0.27,<1",
    # Only for tests/e2e/test_real_inspection.py's real-image fixtures -- the
    # production code path never touches an image codec (see inference/).
    "opencv-python-headless>=4.9,<5",
]
# Milestone M9/M10 wiring (docs/milestones/M20.md): onnxruntime backs the
# anomaly detector once app.app.build_anomaly_detector() has a MODEL_PATH
# configured. Still lazily imported (see inference/onnx.py's
# _import_onnxruntime()) and gracefully degraded when absent -- an edge
# deployment with no model configured never needs it -- but it is no longer
# training-only, so it is declared like everything else lazily imported.
inference = [
    "onnxruntime>=1.18,<2",
]
# Milestone M19's optional AI services: historical-defect retrieval and local
# LLM advisory. Both are lazily imported (see retrieval/faiss_index.py and
# advisory/ollama_engine.py) and degrade gracefully when absent - this group
# exists so they are discoverable and pinned.
intelligence = [
    "faiss-cpu>=1.8,<2",
    "ollama>=0.3,<1",
]


[tool.hatch.build.targets.wheel]
packages = ["src/adaptivevision"]

# ---------------------------------------------------------------------------
# Black: formatter (kept consistent with the Ruff formatter)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "ANN"]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "ANN401", # allow typing.Any at serialization / messaging boundaries
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and scaffold scripts need not carry full docstring/annotation rigor.
"tests/*" = ["D", "ANN"]
# Offline model-training scripts (torch/onnx), not part of the frozen src tree.
"training/*" = ["D", "ANN"]
# Embedded HTML/CSS/JS template and FastAPI's idiomatic File()/Form() defaults.
"training/dashboard_app.py" = ["E501", "B008"]

# ---------------------------------------------------------------------------
# mypy: strict static typing on production code
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = ["src", "scripts"]
files = ["src", "scripts"]



# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source_pkgs = ["adaptivevision"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
