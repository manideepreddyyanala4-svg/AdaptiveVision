[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptivevision"
version = "0.0.0"
description = "Industrial 2D/3D Vision, AOI & Metrology Edge Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AdaptiveVision Team" }]
keywords = ["computer-vision", "aoi", "metrology", "edge-ai", "industrial"]
# Runtime dependencies are added by the milestone that first needs them.
# Milestone M4 introduces SQLAlchemy for the local edge persistence layer.
dependencies = [
    "numpy>=1.26,<2",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",

    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptivevision"]

# ---------------------------------------------------------------------------
# Black: formatter (kept consistent with the Ruff formatter)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "ANN"]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "ANN401", # allow typing.Any at serialization / messaging boundaries
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and scaffold scripts need not carry full docstring/annotation rigor.
"tests/*" = ["D", "ANN"]

# ---------------------------------------------------------------------------
# mypy: strict static typing on production code
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src", "scripts"]

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source_pkgs = ["adaptivevision"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
